[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pjn-scw-cli"
version = "0.1.0"
description = "Consulta local de los primeros expedientes del Sistema de Consultas Web PJN"
requires-python = ">=3.11"
dependencies = ["playwright==1.63.0"]

[tool.setuptools.packages.find]
where = ["src"]
